name: Release installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Settled once, before three platforms spend twenty minutes building. The
  # version is checked, never rewritten: `npm run release:prepare` is what puts
  # the tag's version into package.json, and a tag that disagrees with the
  # commit it points at is a mistake to stop on. (This used to sync the version
  # from the tag and then check it, which could not fail.)
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify release version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/sync-release-version.mjs --from-tag "${{ github.ref_name }}" --check

      # Every language finished, or no release: a screen left in English, a
      # message missing from a language or a plural form a language needs
      # stops the release here (docs/i18n-plan.md). Plain Node 22 from
      # setup-node carries the TypeScript stripping the check loads the
      # translations with.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require every language to be complete
        run: node --experimental-strip-types scripts/check-i18n-release.mjs

      # Google Drive is the only sync destination, so a build without the
      # OAuth client ships with no sync at all — and builds without a word.
      - name: Require the Google OAuth client
        env:
          HERACLES_GOOGLE_OAUTH_ID: ${{ secrets.HERACLES_GOOGLE_OAUTH_ID }}
          HERACLES_GOOGLE_OAUTH_KEY: ${{ secrets.HERACLES_GOOGLE_OAUTH_KEY }}
        run: |
          if [ -z "$HERACLES_GOOGLE_OAUTH_ID" ] || [ -z "$HERACLES_GOOGLE_OAUTH_KEY" ]; then
            echo "::error::Set the HERACLES_GOOGLE_OAUTH_ID and HERACLES_GOOGLE_OAUTH_KEY repository secrets: without them the release has no sync."
            exit 1
          fi

  macos:
    name: macOS DMG
    needs: preflight
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      # Signed and notarized when the Apple Developer secrets are set; ad-hoc
      # signed otherwise, so a release without an Apple account still ships the
      # other two platforms instead of failing here. An ad-hoc build opens only
      # after the user allows it in System Settings → Privacy & Security, and
      # the updater sends it to the download page rather than installing
      # (`isMacAdHocSigned` in updaterService.ts).
      - name: Check Apple signing secrets
        id: apple
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE_BASE64" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple Developer secrets are not set; the macOS build is ad-hoc signed and not notarized."
          fi

      - name: Import Apple Developer certificate
        if: steps.apple.outputs.signed == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build DMG
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          HERACLES_GOOGLE_OAUTH_ID: ${{ secrets.HERACLES_GOOGLE_OAUTH_ID }}
          HERACLES_GOOGLE_OAUTH_KEY: ${{ secrets.HERACLES_GOOGLE_OAUTH_KEY }}
        run: |
          if [ "${{ steps.apple.outputs.signed }}" = "true" ]; then
            npm run dist:mac
          else
            # The same switches build.yml uses for its unsigned macOS check.
            CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist:mac -- \
              -c.mac.identity=- -c.mac.notarize=false -c.mac.hardenedRuntime=false
          fi

      - name: Verify macOS update artifacts
        run: node scripts/verify-release-artifacts.mjs macos

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: heracles-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml

  linux:
    name: Linux AppImage and deb
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Build AppImage and deb
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HERACLES_GOOGLE_OAUTH_ID: ${{ secrets.HERACLES_GOOGLE_OAUTH_ID }}
          HERACLES_GOOGLE_OAUTH_KEY: ${{ secrets.HERACLES_GOOGLE_OAUTH_KEY }}
        run: npm run dist:linux

      - name: Verify Linux update artifacts
        run: node scripts/verify-release-artifacts.mjs linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: heracles-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml

  windows:
    name: Windows installer
    needs: preflight
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Build NSIS installer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HERACLES_GOOGLE_OAUTH_ID: ${{ secrets.HERACLES_GOOGLE_OAUTH_ID }}
          HERACLES_GOOGLE_OAUTH_KEY: ${{ secrets.HERACLES_GOOGLE_OAUTH_KEY }}
        run: npm run dist:win

      - name: Verify Windows update artifacts
        run: node scripts/verify-release-artifacts.mjs windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: heracles-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

  release:
    name: Publish GitHub Release
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The tag's section of CHANGELOG.md is the release text. GitHub's
      # generated notes list pull requests since the last release, which says
      # nothing for a repository whose history arrived as a fork.
      - name: Write release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "${{ github.ref_name }}" > release-notes.md

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: heracles-macos
          path: release/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: heracles-linux
          path: release/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: heracles-windows
          path: release/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          draft: false
          body_path: release-notes.md
          files: |
            release/macos/*
            release/linux/*
            release/windows/*

  # The README's download badges and table name the installers and their
  # sizes, which exist only now. Written from the published release (as the
  # website is, scripts/lib/release-data.mjs) and committed to main, not to the
  # tag: the tag is history, main is what the repository's page shows.
  readme:
    name: Update README
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write the release into README.md
        id: readme
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-readme-release.mjs

      # A push made with GITHUB_TOKEN starts no workflow, so this commit does
      # not rebuild the installers; the website is redeployed by the job below.
      - name: Commit README.md
        run: |
          if git diff --quiet README.md; then
            echo "README.md already states ${{ steps.readme.outputs.tag }}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the README's downloads for ${{ steps.readme.outputs.tag }}" README.md
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1

  # Called, not triggered: a release published with GITHUB_TOKEN starts no
  # other workflow, so `on: release` in site.yml would never fire. Built from
  # main, so the site keeps whatever changed there after the tag.
  site:
    name: Website
    needs: release
    uses: ./.github/workflows/site.yml
    with:
      ref: main
    secrets: inherit
