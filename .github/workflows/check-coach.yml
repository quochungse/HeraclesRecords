name: Check Coach

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-coach-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coach:
    name: Coach checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Install Electron display libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb libgtk-3-0t64 libgbm1 libnss3 libasound2t64

      # Ubuntu 24.04 denies unprivileged user namespaces to programs AppArmor
      # has no profile for, Electron among them. Chromium's sandbox then falls
      # back to the SUID helper, which `npm ci` leaves unowned by root, and
      # aborts at start-up. The suites cannot opt out with `no-sandbox`: their
      # renderers then die creating shared memory in /dev/shm.
      - name: Let Chromium's sandbox use user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # xvfb-run's default screen is 640x480 at 8 bits; the suites' windows
      # are up to 1600x1200 and Chromium wants a 24-bit visual. Chromium's own
      # log (sandbox, shared memory, GPU process) goes to stderr, so a window
      # that never loads says why in the step's log and its annotation.
      - name: Check Coach in a virtual display
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1200x24" npm run check:coach
        env:
          ELECTRON_ENABLE_LOGGING: "1"

      - name: Upload failed check logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: coach-check-logs
          path: .work/check-coach/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
