name: Check Coach

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-coach-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coach:
    name: Coach checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Install Electron display libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb libgtk-3-0t64 libgbm1 libnss3 libasound2t64

      - name: Check Coach in a virtual display
        run: xvfb-run --auto-servernum npm run check:coach

      - name: Upload failed check logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coach-check-logs
          path: .work/check-coach/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
